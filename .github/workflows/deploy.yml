# Trosheen runs on a Raspberry Pi behind Cloudflare Tunnel.
# Deliberately no push-to-main deployment: production updates are made manually
# on the Pi using ./deploy.sh (build -> SQL migrations -> app -> health check).
name: Production deployment — manual instructions

on:
  workflow_dispatch:

jobs:
  manual-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Explain the production deployment procedure
        run: |
          echo "No remote deployment is executed by GitHub Actions."
          echo "On the Raspberry Pi, back up the PostgreSQL volume and run ./deploy.sh"
          echo "The script runs additive SQL migrations before restarting the app."
